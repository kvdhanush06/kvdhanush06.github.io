name: SEO finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'SEO finalize')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified SEO fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<title>Venkata Dhanush Kakarlamudi — Software Engineer | Backend &amp; Distributed Systems</title>',
              '<title>Venkata Dhanush Kakarlamudi — Software Engineering Portfolio</title>'
          )
          s = s.replace(
              '<meta property="og:title" content="Venkata Dhanush Kakarlamudi — Software Engineer | Backend &amp; Distributed Systems">',
              '<meta property="og:title" content="Venkata Dhanush Kakarlamudi — Software Engineering Portfolio">'
          )
          s = s.replace(
              '<meta name="twitter:title" content="Venkata Dhanush Kakarlamudi — Software Engineer | Backend &amp; Distributed Systems">',
              '<meta name="twitter:title" content="Venkata Dhanush Kakarlamudi — Software Engineering Portfolio">'
          )

          old_same = '''    "sameAs": [\n      "https://www.linkedin.com/in/venkata-dhanush-k/",\n      "https://github.com/kvdhanush06",\n      "https://x.com/kvdhanush06",\n      "https://www.youtube.com/@kvdhanush0608"\n    ],'''
          new_same = '''    "sameAs": [\n      "https://www.linkedin.com/in/venkata-dhanush-k/",\n      "https://github.com/kvdhanush06",\n      "https://x.com/kvdhanush06",\n      "https://medium.com/@kvdhanush06",\n      "https://stackoverflow.com/users/30895562/venkata-dhanush-kakarlamudi",\n      "https://www.youtube.com/@kvdhanush0608/videos"\n    ],'''
          if old_same not in s:
              raise SystemExit('Expected portfolio sameAs block not found')
          s = s.replace(old_same, new_same)
          s = s.replace('"@type": "Person",\n    "name": "Venkata Dhanush Kakarlamudi",', '"@type": "Person",\n    "@id": "https://allkvd.dev/#person",\n    "name": "Venkata Dhanush Kakarlamudi",', 1)

          old_footer = '''  <footer>\n    <div class="container"></div>\n  </footer>'''
          new_footer = '''  <footer>\n    <div class="container">\n      <p><strong>Venkata Dhanush Kakarlamudi</strong> · Software Engineering Portfolio</p>\n      <p>\n        <a href="https://allkvd.dev/">AllKVD</a> ·\n        <a href="https://github.com/kvdhanush06">GitHub</a> ·\n        <a href="https://www.linkedin.com/in/venkata-dhanush-k/">LinkedIn</a> ·\n        <a href="https://x.com/kvdhanush06">X</a> ·\n        <a href="https://medium.com/@kvdhanush06">Medium</a> ·\n        <a href="https://stackoverflow.com/users/30895562/venkata-dhanush-kakarlamudi">Stack Overflow</a> ·\n        <a href="https://www.youtube.com/@kvdhanush0608/videos">YouTube</a>\n      </p>\n      <p><a href="https://drive.google.com/file/d/1NCT6ZCa_HfxCdScqI-1Q2yA6y2c7O-qA/view">Resume</a> · <a href="mailto:kvdhanush06@gmail.com">kvdhanush06@gmail.com</a></p>\n    </div>\n  </footer>'''
          if old_footer not in s:
              raise SystemExit('Expected empty portfolio footer not found')
          s = s.replace(old_footer, new_footer)
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/seo-finalize.yml
          git add index.html .github/workflows/seo-finalize.yml
          git diff --cached --check
          git diff --cached --exit-code || git commit -m "SEO finalize: portfolio identity and footer"
          git push
